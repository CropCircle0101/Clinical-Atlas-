services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: clinicatlas
      POSTGRES_USER: clinicatlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinicatlas}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clinicatlas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicatlas -d clinicatlas"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  clinicatlas_pg:
